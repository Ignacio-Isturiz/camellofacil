server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Igual que el proxy de desarrollo: /api va al backend (mismo origen, sin CORS)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Las traducciones y el index no se cachean: así un cambio de textos llega sin vaciar la caché del navegador
  location /i18n/ {
    add_header Cache-Control "no-cache";
  }

  # Rutas de Angular: cualquier ruta devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
