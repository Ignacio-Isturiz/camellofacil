server {
  listen 80;
  server_tokens off;
  # Hojas de vida de hasta 20 MB (el backend vuelve a validar el tamaño)
  client_max_body_size 21m;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión: el JS y las traducciones viajan con gzip (la woff2 y la webp ya vienen comprimidas).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml image/x-icon text/plain;

  # Cabeceras de seguridad: viven en seguridad.inc y se incluyen en cada location, porque un add_header
  # dentro de una location anula los del server.

  # Igual que el proxy de desarrollo: /api y el inicio con Microsoft (/oauth2) van al backend (mismo origen, sin CORS).
  # Las cabeceras de seguridad de las respuestas del API las pone el backend.
  location ~ ^/(api|oauth2)/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre (chunk-XXXX.js, styles-XXXX.css, media/): nunca cambian, se guardan un año.
  location ~* "^/[^/]*-[A-Z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/seguridad.inc;
  }
  location /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/seguridad.inc;
  }

  # Fuentes e imágenes sin hash: un mes en caché; si cambian, se les cambia el nombre.
  location ~* ^/(fonts|images)/ {
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/seguridad.inc;
  }

  # Las traducciones y el index no se cachean: así un cambio de textos llega sin vaciar la caché del navegador.
  location /i18n/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguridad.inc;
  }

  # Rutas de Angular: cualquier ruta devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/seguridad.inc;
  }
}
