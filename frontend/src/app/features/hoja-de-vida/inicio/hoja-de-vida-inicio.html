@switch (estado()) {
  @case ('cargando') {
    <div class="cargando" aria-busy="true">
      <p class="cargando__aviso" role="status">
        {{ (servicio.despertando() ? 'hoja.cargando.despertando' : 'hoja.cargando.normal') | transloco }}
      </p>
      <app-esqueleto-hoja />
    </div>
  }
  @case ('error') {
    <app-aviso-error (reintentar)="reintentar()" />
  }
  @default {
    <!-- Cada persona ve solo una de las dos pantallas: cada una se descarga cuando se necesita. -->
    @if (confirmada()) {
      @defer (on immediate) {
        <app-principal />
      } @placeholder {
        <app-esqueleto-hoja />
      }
    } @else {
      @defer (on immediate) {
        <app-primera-vez
          [sinConfirmar]="resumen()?.estado === 'sin_confirmar'"
          [pendientes]="resumen()?.pendientesRevision ?? null"
        />
      } @placeholder {
        <app-esqueleto-hoja />
      }
    }
  }
}
