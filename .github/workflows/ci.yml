# Integración continua: se ejecuta en cada PR y en cada push a main.
# El despliegue (CD) lo hace Render solo cuando este workflow termina en verde (autoDeployTrigger: checksPass).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilar y probar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Incluye las pruebas de arquitectura (ArchUnit) y las de integración con Postgres real (Testcontainers,
      # que usa el Docker del runner).
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (probar y compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  imagen-backend:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Es la misma imagen que construye Render: si no compila aquí, tampoco allá.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
