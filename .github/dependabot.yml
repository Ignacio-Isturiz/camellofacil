# Alertas y PRs de actualización de dependencias (exigido por el skill de seguridad del proyecto).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # Los paquetes de Angular (y TypeScript, que cada versión exige) solo funcionan si suben juntos: por separado
      # npm no puede resolverlos (ERESOLVE) y el PR nunca pasa. Así llegan en un único PR que sí se puede probar.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "typescript"
    ignore:
      # El ejecutor de pruebas de Angular (@angular/build) exige la misma versión mayor de vitest: subirla sola rompe
      # cualquier npm install (ERESOLVE) aunque el CI, que usa npm ci, no lo note.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # Las imágenes base siguen la versión del proyecto, no la última: Java 21 (LTS) en el backend y Node 24 en el
  # frontend (el mismo que usa Render). Se actualizan parches y menores; un salto mayor se hace a propósito.
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
