spring.application.name=backend
# Render asigna el puerto en PORT; en local sigue siendo 8080.
server.port=${PORT:8080}
# Detrás del proxy de Vercel/Render: respeta X-Forwarded-Proto para que las cookies de sesión sean Secure.
server.forward-headers-strategy=framework

# En desarrollo local lee el .env de la raíz del repositorio (si existe). En producción se usan las variables reales.
spring.config.import=optional:file:../.env[.properties]

# Base de datos y secretos: solo por variables de entorno (nunca en este archivo)
# DB_URL completa (local/Docker) o, si no existe, se arma con DB_HOST, DB_PORT y DB_NAME (Render).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:camellofacil}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo manejan solo las migraciones Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Sesiones en Postgres (sin estado local en el servidor); tablas creadas por Flyway
spring.session.jdbc.initialize-schema=never
# Seguridad: tras 8 horas sin actividad la sesión vence y hay que volver a entrar con Microsoft
spring.session.timeout=8h

# Errores con un único formato (ProblemDetail) y sin detalles internos
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Hojas de vida: máximo 20 MB por archivo (igual que el frontend y nginx)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Contrato OpenAPI: apagado por defecto; solo se activa en desarrollo para generar el cliente de Angular
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# Dominio del frontend permitido por CORS
camellofacil.frontend-url=${FRONTEND_URL:http://localhost:4200}

# URL pública del backend (para la redirect URI registrada en Azure)
camellofacil.backend-url=${BACKEND_URL:http://localhost:8080}

# Login con Microsoft (Entra ID). Solo personas del inquilino de UNAULA con correo del dominio permitido.
camellofacil.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
camellofacil.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
camellofacil.microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
camellofacil.microsoft.dominio-permitido=@unaula.edu.co

# Extracción de datos de la hoja de vida con Groq (API compatible con OpenAI). La llave solo por variable de entorno.
camellofacil.groq.api-key=${GROQ_API_KEY:}
camellofacil.groq.modelo=${GROQ_MODEL:openai/gpt-oss-120b}
camellofacil.groq.url=https://api.groq.com/openai/v1

# Vacantes (RF-30 a RF-34). Llaves solo por variable de entorno. Los límites ya llevan margen de seguridad.
camellofacil.vacantes.intervalo-ingesta=300000
camellofacil.vacantes.jsearch.api-key=${JSEARCH_API_KEY:}
camellofacil.vacantes.jsearch.url=https://api.openwebninja.com/jsearch
camellofacil.vacantes.jsearch.limite=${JSEARCH_LIMITE:180}
camellofacil.vacantes.jsearch.dias-periodo=30
# Al empezar cada periodo, cada búsqueda activa corre una vez (carga inicial); el resto se reparte en los 30 días.
camellofacil.vacantes.jooble.api-key=${JOOBLE_API_KEY:}
# jooble.org es internacional: solo se guardan remotas. Con una llave de co.jooble.org, poner JOOBLE_SOLO_REMOTAS=false y JOOBLE_UBICACION vacío.
camellofacil.vacantes.jooble.url=${JOOBLE_URL:https://jooble.org/api}
camellofacil.vacantes.jooble.ubicacion=${JOOBLE_UBICACION:Remote}
camellofacil.vacantes.jooble.solo-remotas=${JOOBLE_SOLO_REMOTAS:true}
camellofacil.vacantes.jooble.limite=${JOOBLE_LIMITE:90}
camellofacil.vacantes.jooble.dias-periodo=1
# Adaptación de la hoja a una vacante (RN: máximo por persona y día; el día es el de Colombia).
camellofacil.adaptaciones.limite-diario=${ADAPTACIONES_LIMITE_DIARIO:3}
