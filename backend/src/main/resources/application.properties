spring.application.name=backend

# En desarrollo local lee el .env de la raíz del repositorio (si existe). En producción se usan las variables reales.
spring.config.import=optional:file:../.env[.properties]

# Base de datos y secretos: solo por variables de entorno (nunca en este archivo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo manejan solo las migraciones Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Sesiones en Postgres (sin estado local en el servidor); tablas creadas por Flyway
spring.session.jdbc.initialize-schema=never

# Errores con un único formato (ProblemDetail) y sin detalles internos
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Contrato OpenAPI: apagado por defecto; solo se activa en desarrollo para generar el cliente de Angular
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# Dominio del frontend permitido por CORS
camellofacil.frontend-url=${FRONTEND_URL:http://localhost:4200}
