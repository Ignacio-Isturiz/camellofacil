spring.application.name=backend

# En desarrollo local lee el .env de la raíz del repositorio (si existe). En producción se usan las variables reales.
spring.config.import=optional:file:../.env[.properties]

# Base de datos y secretos: solo por variables de entorno (nunca en este archivo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo manejan solo las migraciones Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Sesiones en Postgres (sin estado local en el servidor); tablas creadas por Flyway
spring.session.jdbc.initialize-schema=never
# Seguridad: tras 8 horas sin actividad la sesión vence y hay que volver a entrar con Microsoft
spring.session.timeout=8h

# Errores con un único formato (ProblemDetail) y sin detalles internos
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Contrato OpenAPI: apagado por defecto; solo se activa en desarrollo para generar el cliente de Angular
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# Dominio del frontend permitido por CORS
camellofacil.frontend-url=${FRONTEND_URL:http://localhost:4200}

# URL pública del backend (para la redirect URI registrada en Azure)
camellofacil.backend-url=${BACKEND_URL:http://localhost:8080}

# Login con Microsoft (Entra ID). Solo personas del inquilino de UNAULA con correo del dominio permitido.
camellofacil.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
camellofacil.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
camellofacil.microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
camellofacil.microsoft.dominio-permitido=@unaula.edu.co
