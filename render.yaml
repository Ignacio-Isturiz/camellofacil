# Blueprint de Render: backend (Docker) + frontend (sitio estático). La base de datos es externa (Supabase).
# CD: Render despliega solo cuando el workflow CI de GitHub termina en verde (autoDeployTrigger: checksPass).
# Los secretos (sync: false) se piden al crear el Blueprint y nunca van en este archivo.
services:
  - type: web
    name: camellofacil-api # https://camellofacil-api.onrender.com
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/conexion
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: DB_URL # jdbc:postgresql://<host-del-session-pooler>:5432/postgres?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # El navegador solo habla con el sitio estático, que reenvía /api y /oauth2 al backend
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL # mismo valor que FRONTEND_URL
        sync: false
      - key: API_DOCS_ENABLED
        value: "false"
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JSEARCH_API_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false

  - type: web
    name: camellofacil # https://camellofacil.onrender.com
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - { type: rewrite, source: /api/*, destination: https://camellofacil-api.onrender.com/api/* }
      - { type: rewrite, source: /oauth2/*, destination: https://camellofacil-api.onrender.com/oauth2/* }
      - { type: rewrite, source: /login/oauth2/*, destination: https://camellofacil-api.onrender.com/login/oauth2/* }
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
      - { path: /*, name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=(), payment=()" }
      - { path: /*, name: Content-Security-Policy, value: "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" }
      - { path: /i18n/*, name: Cache-Control, value: no-cache }
